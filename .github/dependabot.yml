# Minutes: version updates monthly (each PR runs the CI). Security updates are
# not tied to this schedule: Dependabot opens them as soon as an advisory lands.
version: 2

# Minor and patch bumps are grouped into a single PR per ecosystem and merged
# automatically once the required checks pass (see
# .github/workflows/dependabot-auto-merge.yml). Major bumps stay in their own
# PR and wait for a manual review.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directories:
      - "/agent"
      - "/agent/gui"
    schedule:
      interval: "monthly"
    groups:
      go-modules:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: "monthly"
    groups:
      npm:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/fileshare"
    schedule:
      interval: "monthly"
    groups:
      docker:
        update-types: ["minor", "patch"]
