name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  detect:
    name: Detect edition
    runs-on: ubuntu-latest
    outputs:
      has_agent: ${{ steps.check.outputs.has_agent }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        # The Go agent ships only with the Enterprise edition. The public
        # Community core has no agent/ directory, so skip the agent job there.
        run: |
          if [ -d agent ]; then
            echo "has_agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_agent=false" >> "$GITHUB_OUTPUT"
          fi

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    # trixie = OpenSSL 3.5 (matches the Docker base and the .deb build). The
    # license tests generate ML-DSA-65 keypairs, which need OpenSSL >= 3.5;
    # ubuntu-latest still ships OpenSSL 3.0, so run this job in a trixie container.
    container: debian:trixie-slim
    steps:
      - name: Install backend dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates pkg-config \
            libsqlite3-dev libssh2-1-dev libssl-dev

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure backend
        working-directory: backend
        run: cmake -S . -B build

      - name: Build backend
        working-directory: backend
        run: cmake --build build -j"$(nproc)"

      - name: Run backend tests
        working-directory: backend/build
        run: ctest --output-on-failure

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check Playwright scenarios load
        working-directory: frontend
        run: npm run test:e2e -- --list

  agent-build-test:
    name: Agent Build & Test
    needs: detect
    if: ${{ needs.detect.outputs.has_agent == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.9"
          cache-dependency-path: agent/go.sum

      - name: Run agent tests
        working-directory: agent
        run: go test ./...

      - name: Build agent
        working-directory: agent
        run: go build ./...
