name: Build & Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g. latest, v0.4.0)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  # Docker Hub stays under the personal namespace (pushed with DOCKERHUB_* secrets).
  DOCKERHUB_REPO: nergyr/endoriumfort
  # GHCR must match the OWNER that runs the workflow: the automatic GITHUB_TOKEN can
  # only publish packages under this repo's org (Endorium-Group). Pushing to another
  # account's namespace fails with "permission_denied: installation does not exist".
  GHCR_REPO: ghcr.io/endorium-group/endoriumfort

jobs:
  # Detect the edition: the public core repo has no pro/ overlay (Community),
  # the private repo does (Enterprise). hashFiles() is only valid in a step, so
  # we expose the result as a job output consumed via the `needs` context.
  detect:
    runs-on: ubuntu-latest
    outputs:
      community: ${{ steps.check.outputs.community }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Detect edition
        id: check
        run: |
          if [ -f backend/src/pro/pro_features.cc ]; then
            echo "community=false" >> "$GITHUB_OUTPUT"
          else
            echo "community=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: detect
    # Runs in BOTH repos (freemium single-image model):
    #  - private repo (pro/ present)  → FREEMIUM image (premium compiled +
    #    license-gated + public prod issuer key) at :<ver> / :latest — the image
    #    everyone deploys and unlocks by applying a license.
    #  - public CE repo (no pro/)     → premium-free Community image at
    #    :<ver>-ce / :community for source purists.
    # Edition + tags are auto-selected in the meta step.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The RBI CEF ("tiles") stage downloads + extracts a ~2GB Chromium Embedded
      # Framework and the image bundles its runtime, so reclaim the runner disk the
      # hosted image wastes on toolchains we don't use (otherwise the build can hit
      # "no space left on device").
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        env:
          HAS_DOCKERHUB: ${{ steps.dockerhub.outputs.enabled }}
          # Via env (not inline ${{ }}) so the free-text dispatch tag can't inject shell.
          IN_TAG: ${{ github.event.inputs.tag }}
        run: |
          # ── Edition detection ──
          # pro/ present (private repo) → publish the FREEMIUM image: premium code
          # compiled in but license-gated (fail-closed → free tier without a
          # license), with the PUBLIC prod issuer key embedded so customers can
          # unlock by simply applying a license. This is the canonical public
          # image (like gitlab/gitlab-ee). pro/ absent (public CE repo) → a
          # premium-free Community image published under a distinct -ce tag.
          if [ -f backend/src/pro/pro_features.cc ]; then
            EDITION=enterprise; PROD_ISSUER=ON; SUFFIX=""; MOVING=latest
          else
            EDITION=community;  PROD_ISSUER=OFF; SUFFIX="-ce"; MOVING=community
          fi
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "prod_issuer=$PROD_ISSUER" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tags<<EOF" >> "$GITHUB_OUTPUT"
            if [[ "$HAS_DOCKERHUB" == "true" ]]; then
              echo "${{ env.DOCKERHUB_REPO }}:${VERSION}${SUFFIX}" >> "$GITHUB_OUTPUT"
              echo "${{ env.DOCKERHUB_REPO }}:${MOVING}" >> "$GITHUB_OUTPUT"
            fi
            echo "${{ env.GHCR_REPO }}:${VERSION}${SUFFIX}" >> "$GITHUB_OUTPUT"
            echo "${{ env.GHCR_REPO }}:${MOVING}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            TAG="${IN_TAG:-latest}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "tags<<EOF" >> "$GITHUB_OUTPUT"
            if [[ "$HAS_DOCKERHUB" == "true" ]]; then
              echo "${{ env.DOCKERHUB_REPO }}:${TAG}${SUFFIX}" >> "$GITHUB_OUTPUT"
            fi
            echo "${{ env.GHCR_REPO }}:${TAG}${SUFFIX}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # GITHUB_TOKEN can only write packages under the workflow repo's OWNER.
          # This repo is private under a different owner than the target org
          # (endorium-group), so cross-org push needs a PAT with write:packages
          # that has access to that org. Set secret GHCR_TOKEN (PAT) + optionally
          # var GHCR_USER (the PAT owner). Falls back to GITHUB_TOKEN when the
          # workflow repo IS under the target org (e.g. the public CE repo).
          username: ${{ vars.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Edition is auto-detected in the meta step: the private repo publishes
          # the FREEMIUM image (premium compiled + license-gated + public prod
          # issuer key embedded → apply a license to unlock); the public CE repo
          # publishes a premium-free Community image under a -ce tag. The prod
          # issuer key embedded here is a PUBLIC key — no secret is exposed.
          build-args: |
            EDITION=${{ steps.meta.outputs.edition }}
            PROD_ISSUER=${{ steps.meta.outputs.prod_issuer }}
            RBI_ENGINE=cef
            CEF_VERSION=154.0.32+g682c378+chromium-154.0.8037.58
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=EndoriumFort
            org.opencontainers.image.description=Privileged Access Management (PAM) Bastion (${{ steps.meta.outputs.edition }}; premium license-gated)
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/Endorium-Group/EndoriumFort-CE
            org.opencontainers.image.vendor=Endorium-Group

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign published container images (keyless)
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          HAS_DOCKERHUB: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          if [[ "$HAS_DOCKERHUB" == "true" ]]; then
            cosign sign --yes "${{ env.DOCKERHUB_REPO }}@${DIGEST}"
          fi
          cosign sign --yes "${{ env.GHCR_REPO }}@${DIGEST}"

      - name: Create and attach provenance attestation
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          HAS_DOCKERHUB: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          cat > provenance.json <<JSON
          {
            "buildType": "https://github.com/Attestations/GitHubActionsWorkflow@v1",
            "builder": {
              "id": "https://github.com/${{ github.repository }}/.github/workflows/docker-publish.yml@${{ github.ref }}"
            },
            "invocation": {
              "configSource": {
                "uri": "git+${{ github.server_url }}/${{ github.repository }}.git",
                "digest": {"sha1": "${{ github.sha }}"},
                "entryPoint": ".github/workflows/docker-publish.yml"
              },
              "parameters": {
                "event_name": "${{ github.event_name }}",
                "ref": "${{ github.ref }}"
              },
              "environment": {
                "runner": "github-actions"
              }
            },
            "materials": [
              {
                "uri": "git+${{ github.server_url }}/${{ github.repository }}.git",
                "digest": {"sha1": "${{ github.sha }}"}
              }
            ]
          }
          JSON
          if [[ "$HAS_DOCKERHUB" == "true" ]]; then
            cosign attest --yes --type slsaprovenance --predicate provenance.json "${{ env.DOCKERHUB_REPO }}@${DIGEST}"
          fi
          cosign attest --yes --type slsaprovenance --predicate provenance.json "${{ env.GHCR_REPO }}@${DIGEST}"

      - name: Verify container image signatures
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          HAS_DOCKERHUB: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          verify_signature() {
            local image_ref="$1"
            for i in {1..8}; do
              if cosign verify --certificate-identity-regexp ".*" \
                --certificate-oidc-issuer-regexp ".*" \
                "$image_ref" >/dev/null; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          if [[ "$HAS_DOCKERHUB" == "true" ]]; then
            verify_signature "${{ env.DOCKERHUB_REPO }}@${DIGEST}"
          fi
          verify_signature "${{ env.GHCR_REPO }}@${DIGEST}"

      - name: Verify container image attestations
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          HAS_DOCKERHUB: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          verify_attestation() {
            local image_ref="$1"
            for i in {1..8}; do
              if cosign verify-attestation --certificate-identity-regexp ".*" \
                --certificate-oidc-issuer-regexp ".*" \
                --type slsaprovenance \
                "$image_ref" >/dev/null; then
                return 0
              fi
              # Fallback for registries exposing attestations without typed lookup immediately.
              if cosign verify-attestation --certificate-identity-regexp ".*" \
                --certificate-oidc-issuer-regexp ".*" \
                "$image_ref" >/dev/null; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          if [[ "$HAS_DOCKERHUB" == "true" ]]; then
            verify_attestation "${{ env.DOCKERHUB_REPO }}@${DIGEST}"
          fi
          verify_attestation "${{ env.GHCR_REPO }}@${DIGEST}"

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build_push.outputs.digest }}"
