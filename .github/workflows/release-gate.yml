name: Release Gate

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-gate:
    name: Changelog & Migration Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce changelog updates for code changes
        if: github.actor != 'dependabot[bot]'
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -Eq '^(backend/src/|frontend/src/|agent/.*[.]go$)'; then
            if ! echo "$CHANGED" | grep -Eq '^CHANGELOG.md$'; then
              echo "ERROR: CHANGELOG.md must be updated for backend/frontend/agent runtime changes." >&2
              exit 1
            fi
          fi

      - name: Enforce migration section in PR body when schema/config changes
        if: github.actor != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          if echo "$CHANGED" | grep -Eq '^(backend/src/database|backend/src/routes|docker-compose.yml|Dockerfile|frontend/package.json|agent/.*[.]go$)'; then
            if ! echo "$PR_BODY" | grep -Eiq '(migration|breaking changes?|upgrade|no migration (required|needed)|no breaking changes?|backward compatible|backwards compatible|\bn/?a\b|not applicable)'; then
              echo "ERROR: PR body must include migration/upgrade notes, or explicitly state no migration/no breaking changes, for potentially breaking operational changes." >&2
              exit 1
            fi
          fi

  backend-gate:
    name: Backend Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libssh2-1-dev pkg-config
      - name: Configure
        working-directory: backend
        run: cmake -S . -B build
      # Build everything, not just endoriumfort_backend + endoriumfort_backend_tests:
      # the suite declares 17 separate test executables, so naming two of them
      # left 16 binaries unbuilt and ctest reported them as "Not Run" — which the
      # missing pipefail above then hid behind a green step.
      - name: Build
        working-directory: backend
        run: cmake --build build -j"$(nproc)"
      # `cmd | tee` returns tee's status, so without pipefail a failing ctest
      # left this step green and the gate passed on broken tests.
      - name: Test
        working-directory: backend/build
        shell: bash
        run: |
          set -o pipefail
          ctest --output-on-failure | tee ../../backend-ctest.log

      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-ctest-log
          path: backend-ctest.log

  frontend-gate:
    name: Frontend Unit Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # Same pipefail trap as the backend gate. The log also went to the
      # repository root (`../`) while the upload step looked for it under
      # frontend/, so the artifact was always empty.
      - name: Unit/API tests
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm test | tee frontend-unit.log
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend unit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-log
          path: frontend/frontend-unit.log

  frontend-e2e-gate:
    name: Frontend E2E Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev libssh2-1-dev pkg-config

      - name: Build backend for e2e
        working-directory: backend
        run: |
          cmake -S . -B build
          cmake --build build --target endoriumfort_backend -j"$(nproc)"

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The harness needs a *throwaway* bastion on :8095 (empty data directory,
      # factory admin), not a bare backend on its default port: global-setup
      # drives the factory admin's first login, so it refuses a server whose
      # admin password was already changed. e2e/start-backend.sh provisions it.
      - name: Start throwaway bastion
        working-directory: frontend
        run: nohup npm run e2e:backend > ../backend-e2e.log 2>&1 &

      - name: Wait for the bastion
        run: |
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:8095/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Bastion did not become ready on :8095" >&2
          cat backend-e2e.log || true
          exit 1

      # Playwright starts the interface itself (webServer in playwright.config.mjs,
      # port 5175, proxied to the bastion) — do not start a dev server here.
      # E2E_BROWSER_CHANNEL=chromium is required: the config defaults to the
      # installed Chrome, while this job installs Playwright's own chromium.
      - name: Run e2e tests
        working-directory: frontend
        env:
          E2E_BROWSER_CHANNEL: chromium
        run: npm run test:e2e

      - name: Upload playwright report on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Upload e2e runtime logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-runtime-logs
          path: backend-e2e.log

      - name: Print logs on failure
        if: failure()
        run: |
          echo "--- backend-e2e.log ---"
          cat backend-e2e.log || true

  agent-gate:
    name: Agent Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache-dependency-path: agent/go.sum
      - name: Agent tests
        working-directory: agent
        run: go test ./...
      - name: Agent build
        working-directory: agent
        run: go build ./...

  supply-chain-gate:
    name: Supply Chain Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache-dependency-path: agent/go.sum

      # Pinned on purpose: govulncheck@latest tracks the Go release cycle and
      # starts requiring a newer toolchain than the one pinned above, so the gate
      # breaks with no change on our side. Bump this deliberately, alongside
      # go-version, and never back to @latest.
      - name: Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          cd agent
          govulncheck ./...

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign SBOM (keyless)
        run: |
          cosign sign-blob --yes sbom.cdx.json \
            --bundle sbom.cdx.json.bundle.json

      - name: Verify SBOM signature
        run: |
          cosign verify-blob \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release-gate.yml@.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle sbom.cdx.json.bundle.json \
            sbom.cdx.json >/dev/null

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: repository-sbom
          path: |
            sbom.cdx.json
            sbom.cdx.json.bundle.json

  docker-compose-smoke:
    name: Docker Compose Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and start compose stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose ps -q endoriumfort)"
          if [[ -z "$CONTAINER_ID" ]]; then
            echo "ERROR: endoriumfort container not found" >&2
            docker compose ps || true
            docker compose logs || true
            exit 1
          fi

          HTTP_PORT="${EF_HTTP_PORT:-80}"
          HTTPS_PORT="${EF_HTTPS_PORT:-443}"

          for i in {1..90}; do
            CONTAINER_STATE="$(docker inspect -f '{{.State.Status}}' "$CONTAINER_ID" 2>/dev/null || true)"
            HEALTH_STATUS="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_ID" 2>/dev/null || true)"

            if [[ "$CONTAINER_STATE" == "exited" || "$CONTAINER_STATE" == "dead" ]]; then
              echo "Container stopped unexpectedly (state=$CONTAINER_STATE)" >&2
              docker compose ps || true
              docker compose logs || true
              exit 1
            fi

            if docker exec "$CONTAINER_ID" curl -sf http://127.0.0.1:8080/api/health >/dev/null 2>&1 \
              && curl -skf "https://127.0.0.1:${HTTPS_PORT}/api/health" >/dev/null 2>&1; then
              echo "Compose smoke gate passed (container_state=$CONTAINER_STATE health_status=$HEALTH_STATUS)"
              exit 0
            fi

            sleep 2
          done

          echo "Health endpoint did not become ready in time" >&2
          docker compose ps || true
          docker compose logs || true
          exit 1

      - name: Show service status
        run: docker compose ps

      - name: Stop compose stack
        if: always()
        run: docker compose down -v

      - name: Upload compose logs
        if: always()
        run: docker compose logs > compose-smoke.log || true

      - name: Publish compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-smoke-log
          path: compose-smoke.log
