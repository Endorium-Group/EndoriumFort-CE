name: Security Scan (Trivy)

# Continuous proof for pentests/audits: scans the repo for IaC/Dockerfile
# misconfigurations and for shipped-dependency CVEs, and fails on fixable
# HIGH/CRITICAL. The weekly schedule catches newly-disclosed CVEs in code that
# has not changed. Accepted findings live in .trivyignore (with justifications).

# Minutes: no run on the push to master (it is the PR head already scanned);
# a superseded PR run is cancelled.
on:
  pull_request:
  schedule:
    - cron: '30 4 * * 1'   # Mondays 04:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  misconfig:
    name: IaC / Dockerfile misconfig
    runs-on: ${{ github.actor != 'dependabot[bot]' && vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

  dependencies:
    name: Shipped dependency CVEs
    runs-on: ${{ github.actor != 'dependabot[bot]' && vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true          # only fail on CVEs with an available fix
          exit-code: '1'
          trivyignores: .trivyignore
          # Frontend npm packages are build-time only (the image ships static
          # bundles, not node_modules), so they are out of the runtime scope.
          skip-files: frontend/package-lock.json
          skip-dirs: "node_modules,frontend/node_modules,frontend/dist"
