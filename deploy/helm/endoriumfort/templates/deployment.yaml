{{- if eq .Values.database.type "postgresql" }}
  {{- if and (not .Values.database.postgresql.dsn) (not .Values.database.postgresql.existingSecret) }}
    {{- fail "database.type is \"postgresql\" but no DSN was given: set database.postgresql.dsn or database.postgresql.existingSecret. Without one the pod would silently fall back to the embedded SQLite file." }}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "endoriumfort.fullname" . }}
  labels:
    {{- include "endoriumfort.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate by default: the backend keeps its state in memory and persists to a
  # single-writer SQLite DB on a ReadWriteOnce volume, so two pods must never
  # overlap. Read the warning above `updateStrategy` in values.yaml before
  # switching this to RollingUpdate.
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "endoriumfort.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "endoriumfort.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if include "endoriumfort.renderSecret" . }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "endoriumfort.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: endoriumfort
          image: {{ include "endoriumfort.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: backend
              containerPort: {{ .Values.config.backendPort }}
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            {{- with .Values.config.trustedProxies }}
            - name: ENDORIUMFORT_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: ENDORIUMFORT_PORT
              value: {{ .Values.config.backendPort | quote }}
            - name: ENDORIUMFORT_TOKEN_TTL_SECONDS
              value: {{ .Values.config.tokenTtlSeconds | quote }}
            - name: ENDORIUMFORT_WEBAUTHN_CHALLENGE_TTL_SECONDS
              value: {{ .Values.config.webauthn.challengeTtlSeconds | quote }}
            {{- with .Values.config.webauthn.rpId }}
            - name: ENDORIUMFORT_WEBAUTHN_RP_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.webauthn.origin }}
            - name: ENDORIUMFORT_WEBAUTHN_ORIGIN
              value: {{ . | quote }}
            {{- end }}
            - name: ENDORIUMFORT_RELAY_CERT_REQUIRED
              value: {{ .Values.config.relay.certRequired | quote }}
            - name: ENDORIUMFORT_RELAY_CERT_TTL_SECONDS
              value: {{ .Values.config.relay.certTtlSeconds | quote }}
            - name: ENDORIUMFORT_RELAY_ENROLL_TOKEN_TTL_SECONDS
              value: {{ .Values.config.relay.enrollTokenTtlSeconds | quote }}
            - name: ENDORIUMFORT_RELAY_TOKEN_TTL_SECONDS
              value: {{ .Values.config.relay.tokenTtlSeconds | quote }}
            - name: ENDORIUMFORT_RELAY_HEARTBEAT_STALE_SECONDS
              value: {{ .Values.config.relay.heartbeatStaleSeconds | quote }}
            - name: ACME_ENABLED
              value: {{ ternary "1" "0" .Values.config.acme.enabled | quote }}
            {{- with .Values.config.acme.domain }}
            - name: ACME_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.acme.email }}
            - name: ACME_EMAIL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.siem }}
            {{- with .hostname }}
            - name: ENDORIUMFORT_SIEM_HOSTNAME
              value: {{ . | quote }}
            {{- end }}
            - name: ENDORIUMFORT_SIEM_HEARTBEAT_SECONDS
              value: {{ .heartbeatSeconds | default 300 | quote }}
            {{- if gt (int .queueLimit) 0 }}
            - name: ENDORIUMFORT_SIEM_QUEUE_LIMIT
              value: {{ .queueLimit | quote }}
            {{- end }}
            {{- if gt (int .retryAttempts) 0 }}
            - name: ENDORIUMFORT_SIEM_RETRY_ATTEMPTS
              value: {{ .retryAttempts | quote }}
            {{- end }}
            {{- if .syslog.enabled }}
            - name: ENDORIUMFORT_SIEM_SYSLOG_ENABLED
              value: "1"
            - name: ENDORIUMFORT_SIEM_SYSLOG_HOST
              value: {{ required "config.siem.syslog.host is required when the syslog channel is enabled" .syslog.host | quote }}
            - name: ENDORIUMFORT_SIEM_SYSLOG_PORT
              value: {{ .syslog.port | default 514 | quote }}
            - name: ENDORIUMFORT_SIEM_SYSLOG_PROTOCOL
              value: {{ .syslog.protocol | default "udp" | quote }}
            - name: ENDORIUMFORT_SIEM_SYSLOG_FORMAT
              value: {{ .syslog.format | default "rfc5424" | quote }}
            - name: ENDORIUMFORT_SIEM_SYSLOG_MESSAGE
              value: {{ .syslog.message | default "cee" | quote }}
            - name: ENDORIUMFORT_SIEM_SYSLOG_FRAMING
              value: {{ .syslog.framing | default "octet" | quote }}
            - name: ENDORIUMFORT_SIEM_SYSLOG_FACILITY
              value: {{ .syslog.facility | default 13 | quote }}
            {{- with .syslog.appName }}
            - name: ENDORIUMFORT_SIEM_SYSLOG_APP_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: ENDORIUMFORT_SIEM_SYSLOG_TLS_VERIFY
              value: {{ ternary "1" "0" .syslog.tlsVerify | quote }}
            {{- with .syslog.caFile }}
            - name: ENDORIUMFORT_SIEM_SYSLOG_CA_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .syslog.serverName }}
            - name: ENDORIUMFORT_SIEM_SYSLOG_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .webhook.enabled }}
            - name: ENDORIUMFORT_SIEM_WEBHOOK_ENABLED
              value: "1"
            - name: ENDORIUMFORT_SIEM_WEBHOOK_URL
              value: {{ required "config.siem.webhook.url is required when the webhook channel is enabled" .webhook.url | quote }}
            - name: ENDORIUMFORT_SIEM_WEBHOOK_NDJSON
              value: {{ ternary "1" "0" .webhook.ndjson | quote }}
            {{- end }}
            {{- if .splunk.enabled }}
            - name: ENDORIUMFORT_SIEM_SPLUNK_ENABLED
              value: "1"
            - name: ENDORIUMFORT_SIEM_SPLUNK_URL
              value: {{ required "config.siem.splunk.url is required when the Splunk channel is enabled" .splunk.url | quote }}
            {{- with .splunk.index }}
            - name: ENDORIUMFORT_SIEM_SPLUNK_INDEX
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and (eq .Values.database.type "postgresql") .Values.database.postgresql.existingSecret }}
            - name: ENDORIUMFORT_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.postgresql.existingSecret }}
                  key: {{ .Values.database.postgresql.existingSecretKey }}
            {{- end }}
            {{- if .Values.fileshare.enabled }}
            - name: ENDORIUMFORT_FILESHARE_UPSTREAM
              value: {{ include "endoriumfort.files.upstream" . | quote }}
            - name: ENDORIUMFORT_FILESHARE_MAX_BODY
              value: {{ .Values.fileshare.maxBody | quote }}
            - name: ENDORIUMFORT_FILESHARE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "endoriumfort.files.secretName" . }}
                  key: ENDORIUMFORT_FILESHARE_SECRET
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or (include "endoriumfort.renderSecret" .) .Values.secrets.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ include "endoriumfort.secretName" . }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: recordings
              mountPath: /app/recordings
      volumes:
        - name: data
          {{- if .Values.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim | default (printf "%s-data" (include "endoriumfort.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: recordings
          {{- if .Values.persistence.recordings.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.recordings.existingClaim | default (printf "%s-recordings" (include "endoriumfort.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
