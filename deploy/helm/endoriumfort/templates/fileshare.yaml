{{- if .Values.fileshare.enabled }}
{{- $name := include "endoriumfort.files.fullname" . }}
{{- if not .Values.fileshare.existingSecret }}
{{- /* Keep the ticket key across upgrades: reuse the one already in the cluster. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-key" $name) }}
{{- $key := .Values.fileshare.secret }}
{{- if and (not $key) $existing }}
{{- $key = index $existing.data "ENDORIUMFORT_FILESHARE_SECRET" | b64dec }}
{{- end }}
{{- if not $key }}
{{- $key = randAlphaNum 64 }}
{{- end }}
{{- if lt (len $key) 32 }}
{{- fail "fileshare.secret must be at least 32 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-key
  labels:
    {{- include "endoriumfort.files.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ENDORIUMFORT_FILESHARE_SECRET: {{ $key | quote }}
---
{{- end }}
{{- if and .Values.fileshare.persistence.enabled (not .Values.fileshare.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "endoriumfort.files.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.fileshare.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.fileshare.persistence.size | quote }}
  {{- if .Values.fileshare.persistence.storageClass }}
  storageClassName: {{ .Values.fileshare.persistence.storageClass | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "endoriumfort.files.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  selector:
    {{- include "endoriumfort.files.selectorLabels" . | nindent 4 }}
---
# File share drives, outside the bastion pod: own pod, own volume, non-root,
# read-only root filesystem, no capabilities, no service account token. Single
# replica: drive sessions live in memory and the volume is ReadWriteOnce.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "endoriumfort.files.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "endoriumfort.files.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "endoriumfort.files.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: files
          image: {{ include "endoriumfort.files.image" . | quote }}
          imagePullPolicy: {{ .Values.fileshare.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            - name: ENDORIUMFORT_FILESHARE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "endoriumfort.files.secretName" . }}
                  key: ENDORIUMFORT_FILESHARE_SECRET
            - name: EF_FS_QUOTA_MB
              value: {{ .Values.fileshare.quotaMb | quote }}
            - name: EF_FS_MAX_UPLOAD_MB
              value: {{ .Values.fileshare.maxUploadMb | quote }}
            - name: EF_FS_SESSION_TTL_SECONDS
              value: {{ .Values.fileshare.sessionTtlSeconds | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          {{- with .Values.fileshare.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.fileshare.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.fileshare.persistence.existingClaim | default (printf "%s-data" $name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.fileshare.networkPolicy.enabled }}
---
# Only the bastion pod may reach the service, and the service reaches nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "endoriumfort.files.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "endoriumfort.files.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "endoriumfort.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8090
          protocol: TCP
  egress: []
{{- end }}
{{- end }}
