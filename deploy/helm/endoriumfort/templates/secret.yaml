{{- if include "endoriumfort.renderSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "endoriumfort.fullname" . }}
  labels:
    {{- include "endoriumfort.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (eq .Values.database.type "postgresql") .Values.database.postgresql.dsn }}
  ENDORIUMFORT_DB_DSN: {{ .Values.database.postgresql.dsn | quote }}
  {{- end }}
  {{- with .Values.secrets.vaultKey }}
  ENDORIUMFORT_VAULT_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.license }}
  ENDORIUMFORT_LICENSE: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.relayEnrollSecret }}
  ENDORIUMFORT_RELAY_ENROLL_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.clusterSharedSecret }}
  ENDORIUMFORT_CLUSTER_SHARED_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.siemWebhookToken }}
  ENDORIUMFORT_SIEM_WEBHOOK_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.siemSplunkToken }}
  ENDORIUMFORT_SIEM_SPLUNK_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
