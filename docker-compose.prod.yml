# ─── EndoriumFort — Docker Compose (Production) ───────────────────────────
# Deterministic and hardened deployment profile for production usage.
#
# Usage:
#   cp .env.prod.example .env.prod
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#   docker compose --env-file .env.prod -f docker-compose.prod.yml logs -f
#   docker compose --env-file .env.prod -f docker-compose.prod.yml down
#
# Storage. Two supported modes:
#   * SQLite (default) — embedded file on the ef-data volume. Single node.
#   * PostgreSQL       — set ENDORIUMFORT_DB_DSN and start the bundled server
#                        with the "postgres" profile:
#       docker compose --env-file .env.prod -f docker-compose.prod.yml \
#         --profile postgres up -d
#     Point ENDORIUMFORT_DB_DSN at an external cluster instead and the bundled
#     service stays stopped (omit the profile).

services:
  endoriumfort:
    image: ${DOCKER_IMAGE:-nergyr/endoriumfort}:${DOCKER_TAG:-1.0.3}
    container_name: endoriumfort
    restart: unless-stopped

    networks:
      - default
      - edge
      - files

    ports:
      - "${EF_HTTP_PORT:-80}:80"
      - "${EF_HTTPS_PORT:-443}:443"

    volumes:
      - ef-data:/app/data
      - ef-recordings:/app/recordings
      - ef-letsencrypt:/etc/letsencrypt
      - ef-certbot-www:/var/www/certbot

    environment:
      - TZ=${TZ:-Europe/Paris}
      - ENDORIUMFORT_TRUSTED_PROXIES=${ENDORIUMFORT_TRUSTED_PROXIES:-}
      - ACME_ENABLED=${ACME_ENABLED:-0}
      - ACME_DOMAIN=${ACME_DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - ENDORIUMFORT_PORT=${ENDORIUMFORT_PORT:-8080}
      - ENDORIUMFORT_TOKEN_TTL_SECONDS=${ENDORIUMFORT_TOKEN_TTL_SECONDS:-3600}
      - ENDORIUMFORT_WEBAUTHN_CHALLENGE_TTL_SECONDS=${ENDORIUMFORT_WEBAUTHN_CHALLENGE_TTL_SECONDS:-180}
      - ENDORIUMFORT_WEBAUTHN_RP_ID=${ENDORIUMFORT_WEBAUTHN_RP_ID:-}
      - ENDORIUMFORT_WEBAUTHN_ORIGIN=${ENDORIUMFORT_WEBAUTHN_ORIGIN:-}
      - ENDORIUMFORT_RELAY_ENROLL_SECRET=${ENDORIUMFORT_RELAY_ENROLL_SECRET:-}
      - ENDORIUMFORT_RELAY_CERT_REQUIRED=${ENDORIUMFORT_RELAY_CERT_REQUIRED:-true}
      - ENDORIUMFORT_RELAY_CERT_TTL_SECONDS=${ENDORIUMFORT_RELAY_CERT_TTL_SECONDS:-2592000}
      - ENDORIUMFORT_RELAY_ENROLL_TOKEN_TTL_SECONDS=${ENDORIUMFORT_RELAY_ENROLL_TOKEN_TTL_SECONDS:-600}
      - ENDORIUMFORT_RELAY_TOKEN_TTL_SECONDS=${ENDORIUMFORT_RELAY_TOKEN_TTL_SECONDS:-86400}
      - ENDORIUMFORT_RELAY_HEARTBEAT_STALE_SECONDS=${ENDORIUMFORT_RELAY_HEARTBEAT_STALE_SECONDS:-90}
      # Empty → the embedded SQLite file. A "postgresql://..." URI switches the
      # store at runtime; no image change is needed.
      - ENDORIUMFORT_DB_DSN=${ENDORIUMFORT_DB_DSN:-}
      # Audit-event export to a SIEM / log platform (Enterprise licence).
      # Unset means no export and no background worker. The full variable set
      # is in docs/siem-logging.md; these are the ones a syslog collector needs.
      - ENDORIUMFORT_SIEM_HOSTNAME=${ENDORIUMFORT_SIEM_HOSTNAME:-}
      - ENDORIUMFORT_SIEM_SYSLOG_ENABLED=${ENDORIUMFORT_SIEM_SYSLOG_ENABLED:-0}
      - ENDORIUMFORT_SIEM_SYSLOG_HOST=${ENDORIUMFORT_SIEM_SYSLOG_HOST:-}
      - ENDORIUMFORT_SIEM_SYSLOG_PORT=${ENDORIUMFORT_SIEM_SYSLOG_PORT:-514}
      - ENDORIUMFORT_SIEM_SYSLOG_PROTOCOL=${ENDORIUMFORT_SIEM_SYSLOG_PROTOCOL:-udp}
      - ENDORIUMFORT_SIEM_WEBHOOK_ENABLED=${ENDORIUMFORT_SIEM_WEBHOOK_ENABLED:-0}
      - ENDORIUMFORT_SIEM_WEBHOOK_URL=${ENDORIUMFORT_SIEM_WEBHOOK_URL:-}
      - ENDORIUMFORT_SIEM_WEBHOOK_TOKEN=${ENDORIUMFORT_SIEM_WEBHOOK_TOKEN:-}
      - ENDORIUMFORT_SIEM_WEBHOOK_NDJSON=${ENDORIUMFORT_SIEM_WEBHOOK_NDJSON:-0}
      # File share resources: key shared with the endoriumfort-files service
      # (openssl rand -hex 32). Unset → file share drives answer 503.
      - ENDORIUMFORT_FILESHARE_SECRET=${ENDORIUMFORT_FILESHARE_SECRET:-}
      - ENDORIUMFORT_FILESHARE_UPSTREAM=http://endoriumfort-files:8090
      - ENDORIUMFORT_FILESHARE_MAX_BODY=${ENDORIUMFORT_FILESHARE_MAX_BODY:-2g}

    security_opt:
      - no-new-privileges:true

    pids_limit: 256
    mem_limit: 1g
    cpus: 1.50
    stop_grace_period: 30s

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  # File share drives ("fileshare" resources), kept outside the bastion: own
  # image and volume, non-root, read-only filesystem, no capabilities, and an
  # internal network (no outside access) shared with the bastion's nginx only.
  # It never sees the bastion database; the bastion never sees the files.
  endoriumfort-files:
    image: ${DOCKER_IMAGE_FILES:-nergyr/endoriumfort-files}:${DOCKER_TAG:-1.0.3}
    container_name: endoriumfort-files
    restart: unless-stopped

    networks:
      - files

    volumes:
      - ef-files:/data

    environment:
      - TZ=${TZ:-Europe/Paris}
      - ENDORIUMFORT_FILESHARE_SECRET=${ENDORIUMFORT_FILESHARE_SECRET:-}
      - EF_FS_QUOTA_MB=${EF_FS_QUOTA_MB:-10240}
      - EF_FS_MAX_UPLOAD_MB=${EF_FS_MAX_UPLOAD_MB:-2048}
      - EF_FS_SESSION_TTL_SECONDS=${EF_FS_SESSION_TTL_SECONDS:-900}

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    pids_limit: 128
    mem_limit: 512m
    cpus: 1.00
    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Bundled PostgreSQL. Only started with `--profile postgres`; an external
  # cluster is the better choice when you already run one.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: endoriumfort-postgres
    restart: unless-stopped
    profiles: ["postgres"]

    networks:
      - default

    environment:
      - POSTGRES_DB=${POSTGRES_DB:-endoriumfort}
      - POSTGRES_USER=${POSTGRES_USER:-endoriumfort}
      # No default: the stack must not come up with a guessable password.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      # Keeps indexes deterministic across base-image upgrades.
      - POSTGRES_INITDB_ARGS=--data-checksums

    volumes:
      - ef-postgres:/var/lib/postgresql/data

    # Not published: only the bastion talks to it, over the compose network.
    expose:
      - "5432"

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-endoriumfort} -d ${POSTGRES_DB:-endoriumfort}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

volumes:
  ef-data:
    driver: local
  ef-postgres:
    driver: local
  ef-recordings:
    driver: local
  ef-letsencrypt:
    driver: local
  ef-certbot-www:
    driver: local
  ef-files:
    driver: local

networks:
  edge:
    name: edge
    external: true
  files:
    internal: true
