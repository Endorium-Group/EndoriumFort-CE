# ─── EndoriumFort — Nginx config for Docker ─────────────────────────────
# Serves frontend static files and reverse-proxies API/WS to the backend.

upstream backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /app/frontend;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # API WebSocket endpoints → backend
    location /api/ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Appearance images (login background up to 5 MB) → backend
    # No trailing slash on the location name, and this is deliberate: a prefix
    # location that ends in "/" together with a proxy_pass that carries no URI
    # turns on nginx's auto_redirect, which answers /api/branding itself with a
    # 301 to /api/branding/ — a URL the backend has no route for. Every read and
    # write of the appearance settings ended on that dead URL.
    location /api/branding {
        client_max_body_size 6m;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes → backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket endpoints → backend
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Web proxy passthrough → backend
    location /proxy/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Static assets — cache aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        # nginx REPLACES inherited add_header directives as soon as a location
        # declares one of its own, so the server-level security headers have to
        # be repeated here or they are silently dropped for these responses.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the one file whose name does not change between builds, so a
    # cached copy keeps pointing at the previous build's hashed assets — which
    # are themselves immutable for 30 days. Without this, a returning browser
    # stays on the old interface after a release until someone hard-refreshes.
    location = /index.html {
        # One mechanism only: `expires` emits its own Cache-Control, and using
        # both sends the header twice (as /assets/ already does).
        add_header Cache-Control "no-cache" always;
        # nginx REPLACES inherited add_header directives as soon as a location
        # declares one of its own, so the server-level security headers have to
        # be repeated here or they are silently dropped for these responses.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
